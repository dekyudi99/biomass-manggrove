services:
  database:
    image: postgres:16-alpine
    container_name: biomass_auth_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: biomass_db
      POSTGRES_USER: biomass_user
      POSTGRES_PASSWORD: ${BIOMASS_DB_PASSWORD:?Set BIOMASS_DB_PASSWORD in the ignored root .env file}
    volumes:
      - biomass_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biomass_user -d biomass_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend-fastapi
      dockerfile: Dockerfile
    container_name: biomass_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount folder backend lokal ke /app di container (Live reload aktif)
      - ./backend-fastapi:/app
      - ./backend-fastapi/gee-key.json:/app/credentials/gee-key.json
    env_file:
      - ./backend-fastapi/.env
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=postgresql+psycopg://biomass_user:${BIOMASS_DB_PASSWORD:?Set BIOMASS_DB_PASSWORD in the ignored root .env file}@database:5432/biomass_db
    depends_on:
      database:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend-demonstre
      dockerfile: Dockerfile
    container_name: biomass_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      # Mount folder frontend lokal ke /app di container
      - ./frontend-demonstre:/app
      # Anonymous volume agar node_modules di dalam container tidak tertimpa oleh host
      - /app/node_modules
    env_file:
      - ./frontend-demonstre/.env
    depends_on:
      - backend

volumes:
  biomass_auth_data:
