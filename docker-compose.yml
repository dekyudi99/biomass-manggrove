services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: biomass_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mangrove}
      POSTGRES_USER: ${DB_USER:-mangrove_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mangroveapp123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - biomass_postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mangrove_app} -d ${DB_NAME:-mangrove}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      biomass_network:
        aliases:
          - postgis
          - db-central-postgres

  backend:
    build:
      context: ./backend-fastapi
      dockerfile: Dockerfile
    container_name: biomass_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend-fastapi:/app
      - ./backend-fastapi/gee-key.json:/app/credentials/gee-key.json
      - agb_analysis_results:/data/analysis-results
    env_file:
      - ./backend-fastapi/.env
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=${APP_ENV:-development}
      - AGB_RESULTS_DIR=/data/analysis-results
    command: >-
      sh -c 'attempt=0;
      until alembic upgrade head; do
        attempt=$$((attempt + 1));
        if [ "$$attempt" -ge 20 ]; then
          echo "Database migrations failed after $$attempt attempts; backend startup aborted.";
          exit 1;
        fi;
        echo "Database unavailable for migrations (attempt $$attempt/20); retrying in 3 seconds.";
        sleep 3;
      done;
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app'
    depends_on:
      postgis:
        condition: service_healthy
    networks: 
      - biomass_network

  agb-worker:
    build:
      context: ./backend-fastapi
      dockerfile: Dockerfile
    container_name: biomass_agb_worker
    restart: unless-stopped
    volumes:
      - ./backend-fastapi:/app
      - ./backend-fastapi/gee-key.json:/app/credentials/gee-key.json
      - agb_analysis_results:/data/analysis-results
    env_file:
      - ./backend-fastapi/.env
    environment:
      - PYTHONUNBUFFERED=1
      - AGB_RESULTS_DIR=/data/analysis-results
    depends_on:
      backend:
        condition: service_started
      postgis:
        condition: service_healthy
    command: python -m app.worker
    networks: 
      - biomass_network

  frontend:
    build:
      context: ./frontend-demonstre
      dockerfile: Dockerfile
    container_name: biomass_frontend_app
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      # Mount folder frontend lokal ke /app di container
      - ./frontend-demonstre:/app
      # Anonymous volume agar node_modules di dalam container tidak tertimpa oleh host
      - /app/node_modules
    env_file:
      - ./frontend-demonstre/.env
    depends_on:
      - backend
    networks: 
      - biomass_network

volumes:
  biomass_postgres_data:
  agb_analysis_results:

networks:
  biomass_network:
    name: biomass_network
    driver: bridge
