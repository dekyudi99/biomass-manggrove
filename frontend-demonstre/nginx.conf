server {
    listen 80;
    server_name localhost;

    # Folder tempat file build React (dist) diletakkan
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Penanganan routing SPA (React Router)
    # Jika file fisik ($uri) atau direktori ($uri/) tidak ditemukan,
    # arahkan request ke index.html agar rute tidak 404 saat di-reload
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caching untuk aset statis agar loading cepat
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri /index.html;
    }

    # Halaman error default
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

